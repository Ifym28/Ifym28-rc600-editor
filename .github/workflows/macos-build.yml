name: RC-600 Editor (macOS build)

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
      - name: Check the signature and start the Apple Silicon app
        run: |
          APP="dist/mac-arm64/RC-600 Editor.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E "Signature|flags|Identifier"
          "$APP/Contents/MacOS/RC-600 Editor" > app.log 2>&1 &
          PID=$!
          sleep 12
          if kill -0 $PID 2>/dev/null; then
            echo "The app is still running after 12 s."
            kill $PID
          else
            echo "The app stopped at launch:"; cat app.log; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: RC-600-Editor-macOS
          path: dist/*.dmg
          if-no-files-found: error
