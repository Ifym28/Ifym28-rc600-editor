name: RC-600 Editor (macOS build)

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: RC-600-Editor-macOS
          path: dist/*.dmg
          if-no-files-found: error
